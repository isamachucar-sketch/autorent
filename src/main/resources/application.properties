spring.application.name=autorent
server.port=8080

# ---------- H2 (base de datos en memoria, tal como indica el documento) ----------
spring.datasource.url=jdbc:h2:mem:autorent
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# create-drop: crea las tablas al iniciar y las borra al detener la app
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Datos predeterminados (src/main/resources/data.sql) ----------
# always: ejecuta data.sql en cada arranque (también con H2 en memoria)
# defer-datasource-initialization: espera a que Hibernate cree las tablas antes de insertar
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# ---------- Consola web de H2: http://localhost:8080/h2-console ----------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

